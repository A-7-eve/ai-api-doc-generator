# AI辅助接口文档自动生成系统 - Docker Compose 一键部署
#
# 三个服务：
#   db      : MySQL 8.0（宿主端口 3307，避开本机已装的 MySQL 3306）
#   backend : FastAPI 后端（容器 8000，不直接暴露宿主，仅 nginx 反代；调试可在下方取消注释）
#   web     : nginx 前端（宿主 http://localhost:8080）
#
# 使用：
#   docker compose up -d --build   # 首次构建并启动
#   docker compose logs -f backend # 看后端日志
#   docker compose down            # 停止（数据保留在卷里）
#   docker compose down -v         # 停止并删除数据（慎用）

services:
  db:
    image: mysql:8.0
    container_name: apidoc-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${APIDOC_DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${APIDOC_DB_NAME:-apidoc}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - apidoc-mysql:/var/lib/mysql
    # 宿主 3307 → 容器 3306（本机 3306 已被占用，改端口避免冲突）
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: apidoc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 指向 compose 内的 db 容器（APIDOC_* 环境变量优先于 .env 默认值）
      APIDOC_DB_HOST: db
      APIDOC_DB_PORT: "3306"
      APIDOC_DB_USER: root
      APIDOC_DB_PASSWORD: ${APIDOC_DB_PASSWORD:-123456}
      APIDOC_DB_NAME: ${APIDOC_DB_NAME:-apidoc}
      # 大模型供应商：deepseek（默认）/ teleai（星辰）
      # Key 从容器内 backend/.env 读取（构建时 .dockerignore 排除了 .env，
      # 因此用 secrets 挂载或此处直接注入，见下方 LLM_API_KEY）
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TELEAI_API_KEY: ${TELEAI_API_KEY:-}
      # 内置示例项目路径（容器内挂载点）
      APIDOC_SAMPLE_PATH: /app/sample-project
    volumes:
      # 容器内示例项目路径（parse-sample 功能）
      - ./sample-project:/app/sample-project:ro
    # 调试时可放开宿主映射：
    # ports:
    #   - "8000:8000"

  web:
    build:
      context: ./frontend
    container_name: apidoc-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  apidoc-mysql:
